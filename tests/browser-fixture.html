<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Story Chaos Engine 1.8.4 browser tests</title><link rel="stylesheet" href="/style.css"><style>body{font:15px system-ui;margin:24px;max-width:680px;--SmartThemeBorderColor:#999;--SmartThemeQuoteColor:#386b44;--SmartThemeBodyColor:#fff;--SmartThemeEmColor:#555}.text_pole{padding:.5em;border:1px solid #999;border-radius:4px;background:#fff;color:#111}.menu_button{padding:.5em}.sce_main_group{padding:12px;border:1px solid #aaa}pre{max-width:100%}</style></head><body><div id="extensions_settings"></div><pre id="test-result">Running browser tests...</pre>
<script>
const handlers=new Map();const events={on(k,f){if(!handlers.has(k))handlers.set(k,new Set());handlers.get(k).add(f);},removeListener(k,f){handlers.get(k)?.delete(f);},async emit(k,...args){for(const f of [...(handlers.get(k)||[])])await f(...args);}};
const eventTypes={};for(const k of ['GENERATION_STARTED','GENERATION_ENDED','GENERATION_STOPPED','MESSAGE_RECEIVED','CHARACTER_MESSAGE_RENDERED','CHAT_CHANGED','MESSAGE_EDITED','MESSAGE_UPDATED','MESSAGE_DELETED','MESSAGE_SWIPED','MESSAGE_SWIPE_DELETED','CHATCOMPLETION_MODEL_CHANGED','CHATCOMPLETION_SOURCE_CHANGED','MAIN_API_CHANGED','CONNECTION_PROFILE_LOADED','CHAT_COMPLETION_PROMPT_READY','GENERATE_AFTER_DATA','CHAT_COMPLETION_SETTINGS_READY','TEXT_COMPLETION_SETTINGS_READY','APP_READY','EXTENSION_SETTINGS_LOADED'])eventTypes[k]=k;
const injections=[],notices=[];const context={chatId:'browser-fixture',characterId:0,name1:'User',name2:'Bonnie',characters:[{name:'Bonnie',avatar:'bonnie.png'}],mainApi:'openai',model:'browser-model',chat:[],chatMetadata:{},extensionSettings:{storyChaosEngine:{customKeywords:'velvet, kiwi',categoryWeights:{humor:0},structureWeights:{time:0,domino:1},schemaVersion:171}},extensionPrompts:{},eventSource:events,eventTypes,
setExtensionPrompt(...a){injections.push(a);this.extensionPrompts[a[0]]={value:a[1]};},saveSettingsDebounced(){},saveMetadataDebounced(){},registerFunctionTool(){},unregisterFunctionTool(){}};
window.SillyTavern={getContext:()=>context};window.toastr={info(...a){const n={args:a};notices.push(n);return n;},clear(n){const i=notices.indexOf(n);if(i>=0)notices.splice(i,1);}};
window.browserFixture={context,events,handlers,injections,notices};
</script>
<script type="module">
import * as lifecycle from '/entry.js';
const results=[];const $=id=>document.getElementById('sce_'+id);const settings=()=>context.extensionSettings.storyChaosEngine;
const assert=(v,msg='Assertion failed')=>{if(!v)throw new Error(msg);};
const tick=()=>new Promise(resolve=>setTimeout(resolve,15));
const input=(id,value,event='change')=>{const el=$(id);assert(el,'Missing actual DOM element: '+id);if(typeof value==='boolean')el.checked=value;else el.value=String(value);el.dispatchEvent(new Event(event,{bubbles:true}));};
async function test(name,fn){try{await fn();results.push({name,passed:true});}catch(e){results.push({name,passed:false,error:e.stack||String(e)});}}
await tick();lifecycle.onActivate();await tick();
await test('real ESM manifest entry initializes actual DOM controls',()=>{assert($('settings'));assert($('mode'));assert($('role'));assert($('run_receipt'));assert($('settings').querySelectorAll('[id^="sce_cat_"]').length===11);assert($('settings').querySelectorAll('select[id^="sce_structure_"]').length===21);});
await test('there are no duplicate control IDs',()=>{const ids=[...$('settings').querySelectorAll('[id]')].map(x=>x.id);assert(new Set(ids).size===ids.length);});
await test('default label is Custom and legacy keyword values survive',()=>{assert($('preset').value==='custom');assert($('keywords').value==='velvet, kiwi');assert($('cat_humor').value==='0');assert($('structure_time').value==='0');assert($('structure_domino').value==='1');});
await test('selecting a preset does not apply it until Apply is clicked',()=>{const before=settings().intensity;input('preset','balanced');assert(settings().intensity===before);$('apply_preset').click();assert(settings().intensity===65);assert(settings().structureInfluence===82);assert(settings().beatDensity===60);assert($('preset').value==='balanced');assert(settings().categoryWeights.humor===0);assert(settings().customKeywords==='velvet, kiwi');assert(settings().structureWeights.time===0);assert(settings().structureWeights.domino===1);});
await test('manual tuning displays Custom instead of a misleading preset',()=>{input('intensity',71,'input');assert($('preset').value==='custom');assert($('intensity_out').textContent==='71%');});
await test('explicit Off wins under Autopilot and effective-state text agrees',()=>{input('autopilot',true);input('override_endingWatchEnabled','off');assert(settings().autopilotEnabled);assert($('override_endingWatchEnabled').value==='off');assert($('effective_endingWatchEnabled').textContent.includes('Off'));input('override_feedbackObserverEnabled','off');assert($('effective_feedbackBalancerEnabled').textContent.includes('Off'));});
await test('keyword edit remains text and cannot inject HTML',()=>{input('keywords','<img src=x onerror="window.bad=true">, velvet','input');assert(!window.bad);assert(!$('settings').querySelector('img'));assert(settings().customKeywords.includes('<img'));input('keywords','velvet, kiwi','input');});
await test('impossible minimum/window combination is corrected in the real select',()=>{input('ending_window',8);input('ending_minimum',5);input('ending_window',4);assert(settings().endingWatchMinimum<=4);assert([...$('ending_minimum').options].find(x=>x.value==='5').disabled);});
await test('master Off prevents all prompt injection',async()=>{input('enabled',false);await storyChaosEngineInterceptor([],8192,()=>{},'normal');assert(context.extensionPrompts.story_chaos_engine_auto.value==='');assert(!$('enabled').checked);input('enabled',true);});
await test('all creative categories Off permits keyword-only mode without hidden cues',async()=>{for(const el of $('settings').querySelectorAll('[id^="sce_cat_"]')){el.value='0';el.dispatchEvent(new Event('change'));}input('override_structureEnabled','off');input('override_endingWatchEnabled','off');input('keywordboost',100,'input');await storyChaosEngineInterceptor([],8192,()=>{},'normal');const prompt=context.extensionPrompts.story_chaos_engine_auto.value;assert(prompt.includes('velvet')||prompt.includes('kiwi'));assert(!/Lens|Architecture|Optional focus|Optional pacing|Optional wildcard/.test(prompt),prompt);});
await test('new family selectors control delivered routes and honor Off in the real DOM',async()=>{
const saved={weights:{...settings().structureWeights},override:settings().featureOverrides.structureEnabled,influence:settings().structureInfluence,density:settings().beatDensity};
try{
for(const el of $('settings').querySelectorAll('select[id^="sce_structure_"]'))input(el.id.slice(4),0);
input('structure_resume',3);input('override_structureEnabled','on');input('structure_influence',100,'input');input('structure_density',100,'input');
assert(settings().structureWeights.resume===3);await storyChaosEngineInterceptor([],8192,()=>{},'normal');
const prompt=context.extensionPrompts.story_chaos_engine_auto.value,title=$('structure_resume').previousElementSibling.textContent;
assert(prompt.includes('Form: '+title),prompt);assert(/^Route: .+/m.test(prompt),prompt);assert(/^Transition: .+/m.test(prompt),prompt);assert(/^Attention: [A-Z].+/m.test(prompt),prompt);
input('structure_resume',0);await storyChaosEngineInterceptor([],8192,()=>{},'normal');
assert(!/^Form:|^Route:|^Transition:/m.test(context.extensionPrompts.story_chaos_engine_auto.value));assert($('effective_structureEnabled').textContent.includes('Off'));
}finally{
for(const [id,value] of Object.entries(saved.weights))input('structure_'+id,value);
input('override_structureEnabled',saved.override);input('structure_influence',saved.influence,'input');input('structure_density',saved.density,'input');
}
});
await test('complete preview leaves prompt and histories untouched',()=>{const n=injections.length;$('preview').click();assert(!$('preview_text').hidden);assert($('preview_text').textContent.includes('Sampled preview'));assert(injections.length===n);});
await test('real lifecycle hooks are idempotent and retain exactly one subscription',()=>{lifecycle.onActivate();lifecycle.onActivate();assert(document.querySelectorAll('#sce_settings').length===1);for(const set of handlers.values())assert(set.size===1);});
async function prepareReply(text,{aborted=false,renderFirst=false}={}){context.chat.push({is_user:true,name:'User',mes:'I watch.'});await events.emit('GENERATION_STARTED','normal',{},false);await storyChaosEngineInterceptor([],8192,()=>{},'normal');const prompt=context.extensionPrompts.story_chaos_engine_auto.value;const id=context.chat.length;const started=new Date(Date.now()+1);context.chat.push({is_user:false,name:'Bonnie',mes:text,gen_started:started,gen_finished:new Date(+started+1)});context.streamingProcessor={messageId:id,timeStarted:started,isFinished:!aborted,isStopped:aborted,abortController:{signal:{aborted}}};await events.emit('CHAT_COMPLETION_SETTINGS_READY',{stream:true,messages:[{role:'user',content:prompt}]});if(!renderFirst)await events.emit('GENERATION_ENDED',context.chat.length);await events.emit('MESSAGE_RECEIVED',id,'normal');await events.emit('CHARACTER_MESSAGE_RENDERED',id,'normal');if(renderFirst)await events.emit('GENERATION_ENDED',context.chat.length);await tick();}
await test('successful simulated stream is verified in real rendered UI',async()=>{input('notify',true);await prepareReply('Bonnie folded the green napkin.');assert($('run_receipt').dataset.state==='completed',$('run_receipt').textContent);assert($('run_receipt').textContent.includes('Host completion verified'));assert($('run_receipt').textContent.includes('observed in assembled request'));assert(notices.length===1);});
await test('stopping after render revokes green state and its toast',async()=>{await events.emit('GENERATION_STOPPED');await tick();assert($('run_receipt').dataset.state==='stopped');assert(notices.length===0);});
await test('host error path rendering a partial response never turns green',async()=>{await prepareReply('Bonnie began to',{aborted:true});assert($('run_receipt').dataset.state==='failed',$('run_receipt').textContent);assert(notices.length===0);});
await test('render-before-end success also completes without duplicate notifications',async()=>{await prepareReply('Bonnie opened the wooden drawer.',{renderFirst:true});assert($('run_receipt').dataset.state==='completed');assert(notices.length===1);});
await test('lifecycle disable removes UI/listeners and clears injection',()=>{lifecycle.onDisable();assert(!$('settings'));for(const set of handlers.values())assert(set.size===0);assert(context.extensionPrompts.story_chaos_engine_auto.value==='');});
await test('re-enable remounts actual controls without losing custom settings',async()=>{lifecycle.onEnable();await tick();assert($('settings'));assert($('keywords').value==='velvet, kiwi');for(const set of handlers.values())assert(set.size===1);});
await test('delayed host panel mount initializes through MutationObserver',async()=>{lifecycle.onDisable();document.getElementById('extensions_settings').remove();lifecycle.onEnable();assert(!$('settings'));const host=document.createElement('div');host.id='extensions_settings';document.body.insertBefore(host,document.getElementById('test-result'));await tick();assert($('settings'));});
await test('missing selectors return null rather than being fabricated by a mock',()=>{assert($('settings').querySelector('#sce_nonexistent')===null);});
const result={browser:navigator.userAgent,tests:results.length,passed:results.filter(x=>x.passed).length,failed:results.filter(x=>!x.passed).length,results};
document.getElementById('test-result').textContent=JSON.stringify(result,null,2);document.documentElement.dataset.testStatus=result.failed?'failed':'passed';
if(new URLSearchParams(location.search).has('visual')){$('settings').querySelector('.sce_main_group').open=true;document.getElementById('test-result').hidden=true;}
</script></body></html>
